<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="mosaic" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#334155"/><rect width="4" height="4" fill="#475569"/>
    </pattern>
  </defs>
  <rect width="880" height="500" fill="url(#bg)" rx="12"/>
  <text x="32" y="48" fill="#f1f5f9" font-size="21" font-weight="600">越权链验证 · 成果示意图</text>
  <text x="32" y="72" fill="#94a3b8" font-size="12">所有可识别信息（姓名 / 手机 / 证件 / ID / 机构）均已打码 · 数据来自授权测试</text>

  <!-- 表格头 -->
  <rect x="32" y="92" width="816" height="34" fill="#334155" rx="4"/>
  <text x="48" y="114" fill="#cbd5e1" font-size="12">验证步骤</text>
  <text x="300" y="114" fill="#cbd5e1" font-size="12">拿到的数据</text>
  <text x="560" y="114" fill="#cbd5e1" font-size="12">脱敏后效果</text>
  <text x="760" y="114" fill="#cbd5e1" font-size="12">结果</text>

  <!-- 行 -->
  <g font-size="12" fill="#e2e8f0">
    <!-- 1 -->
    <rect x="32" y="128" width="816" height="52" fill="#1e293b"/>
    <text x="48" y="158">零 token 读他人健康数据</text>
    <text x="300" y="158">HTTP 200 + 真实指标</text>
    <text x="560" y="158" fill="#64748b">████ ██████</text>
    <text x="760" y="158" fill="#4ade80">✓ 通过</text>
    <!-- 2 -->
    <rect x="32" y="182" width="816" height="52" fill="#0f172a"/>
    <text x="48" y="212">全量列表泄露患者 ID</text>
    <text x="300" y="212">47 条 · 11 个他人 ID</text>
    <text x="560" y="212" fill="#64748b">████████████</text>
    <text x="760" y="212" fill="#4ade80">✓ 通过</text>
    <!-- 3 -->
    <rect x="32" y="236" width="816" height="52" fill="#1e293b"/>
    <text x="48" y="266">患者 ID 换姓名/手机</text>
    <text x="300" y="266">姓名 + 手机 + 就诊号</text>
    <text x="560" y="266" fill="#64748b">███ █████████</text>
    <text x="760" y="266" fill="#4ade80">✓ 通过</text>
    <!-- 4 -->
    <rect x="32" y="290" width="816" height="52" fill="#0f172a"/>
    <text x="48" y="320">患者 ID 换检验报告</text>
    <text x="300" y="320">19 份 · 反拆深层 ID</text>
    <text x="560" y="320" fill="#64748b">████████ ████</text>
    <text x="760" y="320" fill="#4ade80">✓ 通过</text>
    <!-- 5 -->
    <rect x="32" y="344" width="816" height="52" fill="#1e293b"/>
    <text x="48" y="374">财务接口零参数全量</text>
    <text x="300" y="374">185 账户 · 27791 流水</text>
    <text x="560" y="374" fill="#64748b">████████████</text>
    <text x="760" y="374" fill="#4ade80">✓ 通过</text>
  </g>

  <rect x="32" y="416" width="816" height="52" fill="#1e3a5f" rx="4"/>
  <text x="48" y="446" fill="#93c5fd" font-size="12">判据：本人 ID vs 他人 ID / 有 token vs 无 token 对照实测 · 只写可复现结论</text>
</svg>
